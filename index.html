<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Fichas RPG</title>
  <!-- O ?v=99 força o navegador a carregar o estilo novo sem pegar cache velho -->
  <link rel="stylesheet" href="style.css?v=99">
</head>
<body>

  <!-- 1. TELA DE SELEÇÃO INICIAL -->
  <div id="screen-select" class="screen-container active">
    <div class="select-box">
      <h1>SISTEMA DE FICHAS RPG</h1>
      <p>Selecione seu modo de acesso ao banco de dados</p>

      <div class="mode-toggle">
        <button type="button" class="btn-mode active" onclick="switchMode('jogador')">Jogador</button>
        <button type="button" class="btn-mode" onclick="switchMode('mestre')">Mestre</button>
      </div>

      <!-- PAINEL JOGADOR -->
      <div id="panel-jogador" class="access-panel active">
        <label for="player-char-name">Nome do Personagem / ID:</label>
        <input type="text" id="player-char-name" placeholder="Ex: Morpheus, Ronaldo, etc">
        <button type="button" class="btn-primary btn-large" onclick="carregarFichaJogador()">Carregar / Criar Ficha</button>
      </div>

      <!-- PAINEL MESTRE -->
      <div id="panel-mestre" class="access-panel">
        <label for="gm-pass">Senha do Mestre:</label>
        <input type="password" id="gm-pass" placeholder="Digite a senha do Mestre">
        <button type="button" class="btn-primary btn-large" onclick="acessarPainelMestre()">Acessar Painel do Mestre</button>
      </div>
    </div>
  </div>

  <!-- 2. TELA DO PAINEL DO MESTRE -->
  <div id="screen-gm-dashboard" class="screen-container">
    <div class="gm-header">
      <h2>Painel de Controle do Mestre</h2>
      <button type="button" class="btn-danger" onclick="sairParaSelecao()">Sair</button>
    </div>
    <div class="gm-cards-grid" id="gm-cards-container">
      <!-- Cards dos jogadores serão injetados aqui via JS -->
    </div>
  </div>

  <!-- 3. TELA DA FICHA DO JOGADOR -->
  <div id="screen-player-sheet" class="screen-container">
    
    <div class="top-nav-bar">
      <button type="button" class="btn-sub" onclick="sairParaSelecao()">← Trocar Ficha / Sair</button>
      <span class="ficha-label" id="current-sheet-title">Editando Ficha: Nenhuma</span>
      <button type="button" class="btn-primary" id="btn-gm-mode-toggle" style="display:none;">MODO MESTRE</button>
    </div>

    <!-- CABEÇALHO DA FICHA -->
    <header class="ficha-header">
      <div class="header-grid">
        <div class="field field-small">
          <label>Nível:</label>
          <input type="number" id="char-level" value="1">
        </div>
        <div class="field field-small">
          <label>NEX:</label>
          <input type="text" id="char-nex" value="20%">
        </div>
        <div class="field field-small">
          <label>Idade:</label>
          <input type="number" id="char-age" value="18">
        </div>
        <div class="field field-medium">
          <label>Classe Base:</label>
          <select id="char-class">
            <option value="Místico">Místico</option>
            <option value="Especialista">Especialista</option>
            <option value="Combatente">Combatente</option>
          </select>
        </div>
        <div class="field field-medium">
          <label>Nome:</label>
          <input type="text" id="char-name" value="Morpheus">
        </div>
        <div class="field field-medium">
          <label>Exp:</label>
          <div class="xp-field-group">
            <input type="text" id="char-xp" value="0 / 100" readonly>
            <button type="button" class="btn-sub" onclick="openXpModal()">+ XP</button>
          </div>
        </div>
        <div class="field field-medium">
          <label>Origem:</label>
          <input type="text" id="char-origin" value="Músico Fracassado">
        </div>
        <div class="field field-medium">
          <label>Raça:</label>
          <input type="text" id="char-race" value="Revenant">
        </div>
        <div class="field field-small">
          <label>Gênero:</label>
          <input type="text" id="char-gender" value="Masculino">
        </div>
        <div class="field field-small">
          <label>Sexualidade:</label>
          <input type="text" id="char-sexuality" value="Hétero">
        </div>
        <div class="field field-full">
          <label>Classe Adicional:</label>
          <input type="text" id="char-add-class" value="Necromante Lvl:1">
        </div>
        <div class="field field-full">
          <label>Traço:</label>
          <input type="text" id="char-trait" value="Mente Aberta, Desapegado e Colecionador de Tranqueiras">
        </div>
        <div class="field field-full">
          <label>Traumas / Medos:</label>
          <input type="text" id="char-fears" value="Voltar à Vida">
        </div>
      </div>
    </header>

    <!-- STATUS RECURSOS FIXOS -->
    <section class="status-section">
      <h2>{ STATUS RECURSOS }</h2>
      <div class="status-grid">
        <div class="card-status">
          <label>Vida (PV)</label>
          <div class="inline-inputs">
            <input type="number" id="pv-cur" value="22"> / <input type="number" id="pv-max" value="22">
          </div>
        </div>
        <div class="card-status">
          <label>Sanidade (SAN)</label>
          <div class="inline-inputs">
            <input type="number" id="san-cur" value="18"> / <input type="number" id="san-max" value="18">
          </div>
        </div>
        <div class="card-status">
          <label>Esforço (PE)</label>
          <div class="inline-inputs">
            <input type="number" id="pe-cur" value="27"> / <input type="number" id="pe-max" value="31">
          </div>
        </div>
        <div class="card-status">
          <label>Mana (MA)</label>
          <div class="inline-inputs">
            <input type="number" id="ma-cur" value="49"> / <input type="number" id="ma-max" value="49">
          </div>
        </div>
        <div class="card-status">
          <label>Defesa (DEF)</label>
          <input type="number" id="def-val" value="6">
        </div>
        <div class="card-status">
          <label>Evasão (EVA)</label>
          <input type="number" id="eva-val" value="10">
        </div>
        <div class="card-status">
          <label>Tp:</label>
          <input type="number" id="tp-val" value="0">
        </div>
      </div>
    </section>

    <!-- NAVEGAÇÃO POR ABAS -->
    <nav class="tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('tab-atributos')">Atributos & Perícias</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-raridade')">Habilidades de Raridade</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-skills')">Skills, Feitiços & Rituais</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-inventario')">Inventário & Equipamentos</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-efeitos')">Efeitos de Status</button>
      <button type="button" class="tab-btn" onclick="switchTab('tab-anotacoes')">Blocos de Anotações</button>
    </nav>

    <main class="container">
      <!-- CONTEÚDO DA ABA ATRIBUTOS -->
      <div id="tab-atributos" class="tab-content active">
        <h2>{ ATRIBUTOS }</h2>
        <div class="atributos-grid">
          <div class="card-attr"><label>Força</label><input type="number" value="12"></div>
          <div class="card-attr"><label>Agilidade</label><input type="number" value="10"></div>
          <div class="card-attr"><label>Vigor</label><input type="number" value="12"></div>
          <div class="card-attr"><label>Inteligência</label><input type="number" value="13"></div>
          <div class="card-attr"><label>Presença</label><input type="number" value="14"></div>
          <div class="card-attr"><label>Carisma</label><input type="number" value="13"></div>
          <div class="card-attr"><label>Sorte</label><input type="number" value="10"></div>
        </div>
      </div>
    </main>

  </div>

  <!-- MODAL DE XP -->
  <div id="modal-xp" class="modal-overlay">
    <div class="modal-box">
      <h3>Gerenciador de Experiência</h3>
      <input type="number" id="xp-input-val" placeholder="Quantidade de XP">
      <div class="modal-quick-buttons">
        <button type="button" class="btn-sub" onclick="addXpVal(10)">+10</button>
        <button type="button" class="btn-sub" onclick="addXpVal(50)">+50</button>
        <button type="button" class="btn-sub" onclick="addXpVal(100)">+100</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-primary" onclick="confirmAddXp()">Adicionar</button>
        <button type="button" class="btn-danger" onclick="closeXpModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
